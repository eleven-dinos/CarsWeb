{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<div class="login-box">
  <h1>Log in</h1>
  {% if error %}<p class="error-box">{{ error }}</p>{% endif %}
  <form method="post" action="/login" class="form">
    <input type="hidden" name="csrf_token" value="{{ login_csrf_token }}">

    <label for="username">Username</label>
    <input id="username" name="username" maxlength="30" autocomplete="username" required>

    <label for="password">Password</label>
    <input id="password" name="password" type="password" maxlength="128" autocomplete="current-password" required>

    <div class="inline-actions">
      <button type="submit" class="button primary">Log in</button>
    </div>
  </form>
</div>
{% endblock %}
